name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Security Audit ───────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for exposed secrets or real API keys
        run: |
          # Fail if a real Web3Forms UUID is committed (not the placeholder)
          if grep -E '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' index.html; then
            echo "::error::Real Web3Forms access key found in index.html. Remove it and use the placeholder."
            exit 1
          fi
          echo "No exposed API keys found."

      - name: Verify SRI on all CDN resources
        run: |
          missing=$(grep -E '<(script|link rel="stylesheet")[^>]+https?://' index.html | grep -v 'integrity=')
          if [ -n "$missing" ]; then
            echo "::error::CDN resources missing SRI integrity attributes:"
            echo "$missing"
            exit 1
          fi
          echo "All CDN resources have SRI integrity attributes."

      - name: Verify script-src does not contain unsafe-inline
        run: |
          if grep -oE "script-src[^;]+" index.html | grep -q "'unsafe-inline'"; then
            echo "::error::CSP script-src contains 'unsafe-inline' — remove it to prevent XSS."
            exit 1
          fi
          echo "CSP script-src is clean (no unsafe-inline)."

      - name: Check for hardcoded credentials in JS
        run: |
          if grep -rE "(password|secret|token|api_key)\s*[:=]\s*['\"][^'\"]{8,}" assets/js/; then
            echo "::error::Potential hardcoded credential found in assets/js/"
            exit 1
          fi
          echo "No hardcoded credentials found in JS files."

  # ── HTML Validation ──────────────────────────────────────────────────────────
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: npx --yes html-validate@latest --config .htmlvalidate.json index.html error.html

  # ── Lighthouse Audit ─────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: [security-audit, validate-html]
    # Lighthouse is slow and costly — only run on push to main, not PRs
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Serve site locally
        run: npx --yes serve@latest . --listen 3000 &
        shell: bash

      - name: Wait for server
        run: npx --yes wait-on@latest http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: 'http://localhost:3000'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── Deploy to GitHub Pages ───────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [security-audit, validate-html]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
